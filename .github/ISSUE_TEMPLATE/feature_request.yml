name: Feature Request
description: Suggest an idea or enhancement for Sotrix
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve or what is missing?
      placeholder: Describe the current limitation or use case...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What should happen or how should it work?
      placeholder: Describe your proposed feature or workflow...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any extra details, UI ideas, or reference links.
