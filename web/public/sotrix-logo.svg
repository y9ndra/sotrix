<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -220 240 280" width="800" height="800" fill="none">
  <defs>
    <!-- Top Face (Subtle metallic obsidian reflection) -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222834" />
      <stop offset="100%" stop-color="#161a22" />
    </linearGradient>

    <!-- Left Face (Deep obsidian shadow) -->
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1015" />
      <stop offset="100%" stop-color="#060709" />
    </linearGradient>

    <!-- Right Face (Mid graphite obsidian) -->
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c24" />
      <stop offset="100%" stop-color="#0d0f13" />
    </linearGradient>

    <!-- Clean 3D Drop Shadow: Elevates the 'S' and defines its contours (Zero glow) -->
    <filter id="cubeShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <!-- Base 3D Cube Block with Razor-Sharp Emerald Lines -->
    <g id="cube">
      <!-- Top face -->
      <polygon points="0,0 -34.64,-20 0,-40 34.64,-20" fill="url(#topFace)" stroke="#10b981" stroke-width="2.2" stroke-linejoin="round"/>
      <!-- Left face -->
      <polygon points="0,0 -34.64,-20 -34.64,20 0,40" fill="url(#leftFace)" stroke="#10b981" stroke-width="2.2" stroke-linejoin="round"/>
      <!-- Right face -->
      <polygon points="0,0 34.64,-20 34.64,20 0,40" fill="url(#rightFace)" stroke="#10b981" stroke-width="2.2" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- Blocks drawn back-to-front with depth shadow -->
  <g filter="url(#cubeShadow)">
    <!-- 1. T3 (Back-Right, Top) -->
    <use href="#cube" x="0" y="-160" />
    
    <!-- 2. M2 (Back-Mid, Middle) -->
    <use href="#cube" x="-34.64" y="-100" />
    
    <!-- 3. T2 (Back-Mid, Top) -->
    <use href="#cube" x="-34.64" y="-140" />
    
    <!-- 4. T6 (Mid-Right, Top) -->
    <use href="#cube" x="34.64" y="-140" />
    
    <!-- 5. M5 (Core Center, Middle) -->
    <use href="#cube" x="0" y="-80" />
    
    <!-- 6. B4 (Mid-Left, Bottom) -->
    <use href="#cube" x="-34.64" y="-20" />
    
    <!-- 7. B8 (Front-Mid, Bottom) -->
    <use href="#cube" x="34.64" y="-20" />
    
    <!-- 8. M8 (Front-Mid, Middle) -->
    <use href="#cube" x="34.64" y="-60" />
    
    <!-- 9. B7 (Front-Left, Bottom) -->
    <use href="#cube" x="0" y="0" />
  </g>
</svg>
